name: Update portfolio market data

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-portfolio-market-data
  cancel-in-progress: false

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update market prices
        run: node scripts/update-portfolio.mjs

      - name: Commit updated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add portfolio/data/market.json

          if git diff --cached --quiet; then
            echo "No market-data changes to commit."
          else
            git commit -m "Update portfolio market data"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
